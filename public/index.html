<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <!-- Форма входа -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="login" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="reg_login" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg_password" class="form-control" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="reg_last_name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="reg_first_name" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Отчество</label>
                    <input type="text" id="reg_patronymic" class="form-control">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="reg_phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg_email" class="form-control">
                </div>
                <div class="form-group">
                    <label>Адрес доставки</label>
                    <input type="text" id="reg_address" class="form-control">
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>

            <hr>
            <a href="/guest" class="guest-btn">Войти как гость</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
